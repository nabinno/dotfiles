[cli]
installer = "npm"

[marketplace]
default_skills_installs_purged = true
official_marketplace_auto_installed = true

[[marketplace.sources]]
name = "xAI Official"
git = "https://github.com/xai-org/plugin-marketplace.git"

[ui]
max_thoughts_width = 120
yolo = false
compact_mode = false
permission_mode = "always-approve"
# Minimal mode draws with the terminal's own default foreground (white on a dark
# profile) + 16-color ANSI, so text stays bright/readable without truecolor. Switch
# to fullscreen in-session anytime with /fullscreen; `theme` applies only there.
screen_mode = "minimal"
theme = "groknight"

[privacy]
privacy_banner_acked = "2026-11-07T06:17:24Z"
