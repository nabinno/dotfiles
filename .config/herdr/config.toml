onboarding = false

[theme]
name = "one-dark"
auto_switch = false

# herdr 0.9.5 exposes only these foreground tokens: text/accent/green/blue/red/yellow.
# The faint menu gray (#5c6370) and the selected sidebar-row purple (#b1b9f9) are both
# hardcoded in this version and NOT overridable by any token (verified by probing all six,
# on both the stable 0.9.5 and the HEAD build). We darken panel/sidebar backgrounds to
# raise contrast of the fixed gray and neutralize the picker selection to white.
[theme.custom]
text = "#ffffff"
accent = "#ffffff"
blue = "#ffffff"
panel_bg = "#000000"
sidebar_bg = "#000000"
active_row_bg = "#1a1d23"
selection_bg = "reset"

[keys]
# Prefix key to enter prefix mode.
prefix = "ctrl+q"

[ui]
status_indicators = "dots"
# Fully hide the sidebar when toggled (default "compact" leaves a ~4-col rail).
sidebar_collapsed_mode = "hidden"
